<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#f3e2c0">
  <title>Choo-Choo Junction</title>
  <meta name="description" content="A paper-craft train puzzle for kids: pick the right track pieces, press GO and help the train reach the station.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚂</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <a class="btn small" href="../" aria-label="All games" title="All games">🏠</a>
      <button id="levelsBtn" class="btn small" title="Levels">☰</button>
      <div id="levelTitle" class="title"></div>
      <button id="soundBtn" class="btn small" title="Sound">🔊</button>
    </header>

    <main id="stage">
      <canvas id="board"></canvas>
      <div id="hint" class="bubble" role="status" aria-live="polite"></div>
    </main>

    <footer id="tray">
      <div id="pieces" class="pieces"></div>
      <div class="controls">
        <button id="rotateBtn" class="btn tool" title="Turn piece (R)">↻<span>Turn</span></button>
        <button id="clearBtn" class="btn tool" title="Remove piece (Delete)">✕<span>Remove</span></button>
        <button id="goBtn" class="btn go" title="Go! (Space)">GO!</button>
      </div>
    </footer>
  </div>

  <div id="overlay" class="overlay" hidden></div>

  <script src="engine.js"></script>
  <script src="levels.js"></script>
  <script src="audio.js"></script>
  <script src="game.js"></script>
</body>
</html>
