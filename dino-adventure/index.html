<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3e2c0">
  <title>The Runaway Egg</title>
  <meta name="description" content="A choose-your-own dinosaur story for early readers. Help Pip take a runaway egg home to Smoke Mountain.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥚</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header class="top">
      <a class="btn small" href="../" title="All games" aria-label="All games">🏠</a>
      <button id="backBtn" class="btn small" type="button" title="Go back a page" aria-label="Go back a page">↩</button>
      <div id="pouch" class="pouch" aria-label="Pip's pouch"></div>
      <div class="spacer"></div>
      <button id="readBtn" class="btn small" type="button" title="Read it to me" aria-label="Read it to me">🗣️</button>
      <button id="soundBtn" class="btn small" type="button" title="Sound on or off" aria-label="Sound on or off">🔊</button>
    </header>

    <main class="book">
      <div id="stage" class="stage">
        <canvas id="art" aria-label="Picture for this page" role="img"></canvas>
        <div id="pageTitle" class="page-title"></div>
        <div id="pop" class="pop" aria-hidden="true">TOOT!</div>
      </div>
      <section id="panel" class="panel">
        <div id="words" class="words" aria-live="polite"></div>
        <div id="choices" class="choices"></div>
      </section>
    </main>
  </div>

  <script src="story.js"></script>
  <script src="art.js"></script>
  <script src="scenes.js"></script>
  <script src="game.js"></script>
</body>
</html>
